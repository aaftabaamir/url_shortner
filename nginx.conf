events {}

http {
    upstream shortlink_cluster {
        # Round-robin across both stateless app instances.
        # Because all state lives in Postgres/Redis, either instance can
        # serve any request — this is what "stateless horizontal scaling"
        # looks like in practice.
        server app-1:8080;
        server app-2:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://shortlink_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
