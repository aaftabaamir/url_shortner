spring:
  application:
    name: shortlink

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/shortlink
    username: ${DB_USER:shortlink}
    password: ${DB_PASSWORD:shortlink}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.aaftab.shortener.dto"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080

logging:
  level:
    com.aaftab.shortener: INFO
